<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Platform Music Queue</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel now-playing">
        <h1>Şu an çalan</h1>
        <p id="now-title">Bekleniyor...</p>
        <p id="now-requester"></p>
      </section>

      <section class="panel queue">
        <h2>Sıradaki Şarkılar</h2>
        <ul id="queue-list"></ul>
      </section>

      <section class="panel admin">
        <h2>Admin Panel</h2>
        <label>
          Prefix
          <input id="prefix" type="text" />
        </label>
        <label>
          Arkaplan URL
          <input id="background" type="text" />
        </label>
        <button id="save-config">Kaydet</button>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/player.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
